server.port=8883

spring.application.name=account-command-service

# Consul Discovery
spring.cloud.discovery.enabled=true
spring.cloud.consul.discovery.service-name=account-command-service
spring.cloud.consul.discovery.prefer-ip-address=${DISCOVERY_PREFER_IP:true}
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.health-check-critical-timeout=30s
spring.cloud.consul.discovery.tags[0]=account-command-service
spring.cloud.consul.discovery.tags[1]=api
spring.cloud.consul.discovery.tags[2]=version=4.0.1
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Configuration
spring.datasource.username=${DB_USERNAME:account_command_user}
spring.datasource.password=${DB_PASSWORD:account_command_pwd}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:account_command_db}

#HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# AXON CONFIGURATION
axon.serializer.events=jackson
axon.serializer.messages=xstream
axon.serializer.general=jackson
axon.axonserver.enabled=true
axon.axonserver.servers=${AXON_HOST:localhost}:${AXON_PORT:8124}
axon.axonserver.event-store.enabled=true
axon.eventhandling.processors.accountEmailNip.mode=subscribing


# Management/Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.endpoint.consul.access=unrestricted
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Zipkin/Tracing Configuration
management.tracing.export.zipkin.endpoint=${ZIPKIN:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

#Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/bank}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:9090/realms/bank/protocol/openid-connect/certs}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:account-command-service}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:PMlMvVfFj6anf42p2u2TxVud2vK3RqJy}

#Kafka
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic.account-events=${KAFKA_CONSUMER_EVENT_TOPIC:account-events-topic}
